<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="src/styles/outpost.css"></head><body><main class="outpost-desktop"><section class="outpost-stage is-card-view" style="background:radial-gradient(ellipse at 60% 35%,#506a89,#171b2e 95%)"><div class="cards-area"><div class="cards-topline"><span>PAGI · DAILY ROUTINE</span><span>MORNING / 01</span></div><div class="cards-grid"><button class="mission-card card-resource-lifeSupport"><span class="card-bg-particles"></span><div class="card-category-header"><strong>DAILY ROUTINE</strong><small>01</small></div><div class="card-hero-icon"><img src="public/assets/cards/icons/lifeSupport.png"></div><div class="card-detail-panel"><h2 class="card-heading">Clean Air Filter</h2><p class="card-description">About 95% of Mars&#x27; air is carbon dioxide, which astronauts can&#x27;t breathe. Oxygen has to be made or recycled.</p><div class="card-science"><strong>NASA DATASET · Mars atmosphere / MOXIE paper</strong><span>Sumber: Hoffman et al., Science Advances (2022), MOXIE first-year results</span></div><div class="card-effect-row"><span class="card-effect"><span style="font-size:1.25cqw">+</span><b>+10</b></span><span class="card-effect"><span style="font-size:1.25cqw">⬟</span><b>—</b></span><span class="card-effect"><span style="font-size:1.25cqw">ϟ</span><b>-10</b></span><span class="card-effect"><span style="font-size:1.25cqw">🍴</span><b>—</b></span></div></div><div class="card-deploy-action">DEPLOY</div></button><button class="mission-card card-resource-power"><span class="card-bg-particles"></span><div class="card-category-header"><strong>DAILY ROUTINE</strong><small>02</small></div><div class="card-hero-icon"><img src="public/assets/cards/icons/power.png"></div><div class="card-detail-panel"><h2 class="card-heading">Power-Saving Mode</h2><p class="card-description">During a big dust storm in 2022, NASA switched off InSight&#x27;s seismometer to save power, then turned it back on when the sky cleared.</p><div class="card-science"><strong>NASA DATASET · InSight mission</strong><span>Sumber: NASA InSight Mission, power update (25 Oct 2022)</span></div><div class="card-effect-row"><span class="card-effect"><span style="font-size:1.25cqw">+</span><b>-5</b></span><span class="card-effect"><span style="font-size:1.25cqw">⬟</span><b>—</b></span><span class="card-effect"><span style="font-size:1.25cqw">ϟ</span><b>+10</b></span><span class="card-effect"><span style="font-size:1.25cqw">🍴</span><b>—</b></span></div></div><div class="card-deploy-action">DEPLOY</div></button><button class="mission-card card-resource-food"><span class="card-bg-particles"></span><div class="card-category-header"><strong>DAILY ROUTINE</strong><small>03</small></div><div class="card-hero-icon"><img src="public/assets/cards/icons/food.png"></div><div class="card-detail-panel"><h2 class="card-heading">Plan the Meals</h2><p class="card-description">In August 2015, astronauts on the ISS became the first to eat vegetables grown in space: red romaine lettuce.</p><div class="card-science"><strong>NASA DATASET · Veggie / ISS plant research</strong><span>Sumber: NASA, Veggie plant growth system</span></div><div class="card-effect-row"><span class="card-effect"><span style="font-size:1.25cqw">+</span><b>—</b></span><span class="card-effect"><span style="font-size:1.25cqw">⬟</span><b>—</b></span><span class="card-effect"><span style="font-size:1.25cqw">ϟ</span><b>-5</b></span><span class="card-effect"><span style="font-size:1.25cqw">🍴</span><b>+10</b></span></div></div><div class="card-deploy-action">DEPLOY</div></button></div><div class="skip-card" style="text-align:center">LEWATI PILIHAN · PENALTI METER</div></div></section></main></body></html>
